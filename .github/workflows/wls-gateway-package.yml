  workflow_dispatch:
    inputs:
      assemble_release:
        description: Assemble and sign a production package from the approved component store
        required: true
        default: false
        type: boolean
      version:
        description: WLS Gateway release version
        required: true
        default: 2.0.0-dev
        type: string
      target_profile:
        description: Locked platform, architecture and GitHub runner profile
        required: true
        default: linux-x86_64
        type: choice
        options:
          - linux-x86_64
          - linux-arm64
          - darwin-x86_64
          - darwin-arm64
          - windows-x86_64
      provenance_sha256:
        description: Approved SHA-256 of provenance.json in the component store
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: wls-gateway-package-${{ github.ref }}-${{ inputs.target_profile || 'contract' }}
  cancel-in-progress: false

jobs:
  package-contract:
    name: Package contract and release-gate tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: weline
          POSTGRES_USER: weline
          POSTGRES_PASSWORD: weline
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U weline -d weline"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: "8.4"
          extensions: sodium, openssl, intl, pdo_pgsql, pcntl
          coverage: none
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate package assembler and installer contract
        run: >-
          php vendor/bin/phpunit
          --bootstrap app/code/Weline/Server/Test/bootstrap_pgsql.php
          app/code/Weline/Server/Test/Unit/Service/Edge/Gateway/WlsGatewayPackageBuilderTest.php
          app/code/Weline/Server/Test/Unit/Service/Edge/Gateway/HostGatewayPackageManagerTest.php
          app/code/Weline/Server/Test/Unit/Service/Edge/Gateway/GatewayPlatformServiceInstallerSafetyTest.php
          app/code/Weline/Server/Test/Unit/Service/Edge/Gateway/GatewayPlatformRetirementRecoverySourceTest.php
      - name: Validate gateway first-certificate startup contract
        run: >-
          php vendor/bin/phpunit
          --bootstrap app/code/Weline/Server/Test/bootstrap_pgsql.php
          app/code/Weline/Server/Test/Unit/Console/StartCommandArgsSolidificationTest.php
          app/code/Weline/Server/Test/Unit/Service/Edge/Gateway/GatewayPortLeaseAllocatorTest.php
          app/code/Weline/Server/Test/Unit/Service/Edge/Gateway/GatewayProjectStateFilesystemLockTest.php
          app/code/Weline/Server/Test/Unit/Service/Edge/Gateway/GatewayCredentialStoreTest.php
          app/code/Weline/Server/Test/Unit/Service/Edge/Gateway/GatewayFallbackOutageStoreTest.php
          app/code/Weline/Server/Test/Unit/Service/Edge/Gateway/GatewayRuntimeEndpointPublisherTest.php
          app/code/Weline/Server/Test/Unit/Service/Edge/Gateway/GatewayAcmeChallengePublisherTest.php
          app/code/Weline/Server/Test/Unit/Service/Edge/Gateway/ProjectAcmeHttp01ChallengeStoreTest.php
          app/code/Weline/Server/Test/Unit/Service/Edge/Gateway/ProjectCertificateGenerationStoreTest.php
          app/code/Weline/Server/Test/Unit/Service/Edge/Gateway/ProjectIdentityStoreTest.php
          app/code/Weline/Server/Test/Unit/Service/Edge/Gateway/ProjectServingManifestStoreTest.php
          app/code/Weline/Server/Test/Unit/Console/Gateway/GatewayAgentDesiredStateLifecycleTest.php
          app/code/Weline/Server/Test/Unit/Service/Edge/Gateway/GatewayRegistrationRetirementCoordinatorTest.php
          app/code/Weline/Server/Test/Unit/Service/Edge/Gateway/GatewayStopRegistrationPolicyTest.php
          app/code/Weline/Server/Test/Unit/Service/Edge/Gateway/GatewayHostManagerTrustTest.php
          app/code/Weline/Server/Test/Unit/Service/MasterProcessDeferredSslPolicyTest.php
          app/code/Weline/Server/Test/Unit/Service/SslCertificateGatewayAcmePublishRetryTest.php
          app/code/Weline/Server/Test/Unit/SslCertificateServiceTest.php
      - name: Validate gateway Agent, Master lease and fallback runtime contracts
        run: >-
          php vendor/bin/phpunit
          --bootstrap app/code/Weline/Server/Test/bootstrap_pgsql.php
          app/code/Weline/Server/Test/Unit/Console/Gateway/GatewayAgentDrainCountersTest.php
          app/code/Weline/Server/Test/Unit/IPC/ControlMessageGatewayFallbackTransitionTest.php
          app/code/Weline/Server/Test/Unit/Service/GatewayFallbackProviderTest.php
          app/code/Weline/Server/Test/Unit/Service/ServiceOrchestratorStopFlowTest.php
          app/code/Weline/Server/Test/Unit/Worker/GatewayFallbackWorkerListenerTransitionContractTest.php
          app/code/Weline/Server/Test/Unit/Service/MasterChildCredentialStoreTest.php
          app/code/Weline/Server/Test/Unit/Service/MasterLeaseManagerTest.php
          app/code/Weline/Server/Test/Unit/Service/EndpointPersistenceFailureTest.php
          app/code/Weline/Server/Test/Unit/Service/MasterLeaseRuntimeIdentityTerminationTest.php
          app/code/Weline/Server/Test/Unit/Service/ServerInstanceManagerMasterExitRetentionTest.php
          app/code/Weline/Framework/Test/Unit/System/Process/ProcesserWindowsIsolatedBatchReaperTest.php
          app/code/Weline/Server/Test/Unit/Runtime/WindowsListenerHandoffTest.php
      - name: Validate gateway serving projection and diagnostic consumers
        run: >-
          php vendor/bin/phpunit
          --bootstrap app/code/Weline/Server/Test/bootstrap_pgsql.php
          app/code/Weline/Server/Test/Unit/Service/Edge/Gateway/GatewayRuntimeServingProjectionTest.php
          app/code/Weline/Server/Test/Unit/Service/Edge/Gateway/GatewayStartupRuntimeViewTest.php
          app/code/Weline/Server/Test/Unit/Console/StatusCommandTest.php
          app/code/Weline/Server/Test/Unit/Console/BenchmarkCommandTest.php
          app/code/Weline/Server/Test/Unit/Service/Edge/Gateway/GatewayReleaseWorkflowCoverageTest.php
      - name: Validate complete gateway unit contract
        run: >-
          php vendor/bin/phpunit
          --bootstrap app/code/Weline/Server/Test/bootstrap_pgsql.php
          app/code/Weline/Server/Test/Unit/Service/Edge/Gateway
      - name: Validate managed-Nginx, Gateway console, TLS and legacy edge state contracts
        run: >-
          php vendor/bin/phpunit
          --bootstrap app/code/Weline/Server/Test/bootstrap_pgsql.php
          app/code/Weline/Server/Test/Unit/Service/Edge/Nginx
          app/code/Weline/Server/Test/Unit/Console/Gateway
          app/code/Weline/Server/Test/Unit/Service/Runtime/ProtocolEdgeRuntimeOwnershipTest.php
          app/code/Weline/Server/Test/Unit/Service/Runtime/TlsTicketRingStoreRecoveryTest.php
          app/code/Weline/Server/Test/Unit/Service/SslCertificateReuseTest.php
          app/code/Weline/Server/Test/Unit/Service/SslCertificateStorageSecurityTest.php
      - name: Validate WLS request hot-path, timing and HTTP/2 bounds
        run: >-
          php vendor/bin/phpunit
          --bootstrap app/code/Weline/Server/Test/bootstrap_pgsql.php
          app/code/Weline/Server/Test/Unit/Worker/WorkerDetailedHealthCounterHotPathTest.php
          app/code/Weline/Server/Test/Unit/Service/WorkerStaticResponseL1MonotonicTest.php
          app/code/Weline/Server/Test/Unit/Runtime/WorkerFiberContextTrackerTest.php
          app/code/Weline/Server/Test/Unit/Worker/WorkerMonotonicDeadlineDomainTest.php
          app/code/Weline/Server/Test/Unit/Runtime/RuntimeMaintenanceMonotonicTimingTest.php
          app/code/Weline/Server/Test/Unit/Protocol/Http2/ConnectionAdapterHeaderBlockLimitTest.php
      - name: Validate startup and persistent lock safety contracts
        run: >-
          php vendor/bin/phpunit
          --bootstrap app/code/Weline/Server/Test/bootstrap_pgsql.php
          app/code/Weline/Server/Test/Unit/Service/Runtime/RuntimeDependencyBootstrapperLockSafetyTest.php
          app/code/Weline/Server/Test/Unit/Service/Runtime/VerifiedPersistentFileLockSafetyTest.php
          app/code/Weline/Server/Test/Unit/Service/Policy/RuntimePolicyStoreLockSafetyTest.php
          app/code/Weline/Server/Test/Unit/Service/StartupTraceLockSafetyTest.php
          app/code/Weline/Framework/Test/Unit/System/Process/ProcesserDetachedSpawnSecurityTest.php
          app/code/Weline/Framework/Test/Unit/System/Process/ProcesserMonotonicClockContractTest.php
          app/code/Weline/Framework/Test/Unit/System/Process/ProcesserUnixBatchLauncherHandshakeTest.php
      - name: Validate host mutation and instance cleanup transactions
        run: >-
          php vendor/bin/phpunit
          --bootstrap app/code/Weline/Server/Test/bootstrap_pgsql.php
          app/code/Weline/Server/Test/Unit/Console/HostsPrivilegeBoundaryWiringTest.php
          app/code/Weline/Server/Test/Unit/Service/HostsFileManagerTest.php
          app/code/Weline/Server/Test/Unit/Service/HostsFileManagerTransactionTest.php
          app/code/Weline/Server/Test/Unit/Service/ServerInstanceManagerCleanupTransactionTest.php
      - name: Validate security-policy transactions and receipt wiring
        run: >-
          php vendor/bin/phpunit
          --bootstrap app/code/Weline/Server/Test/bootstrap_pgsql.php
          app/code/Weline/Server/Test/Unit/Service/Security/SecurityPolicyStateStoreTest.php
          app/code/Weline/Server/Test/Unit/Security/AttackDetectorStateTransactionTest.php
          app/code/Weline/Server/Test/Unit/Security/SecurityRulesReceiptWiringTest.php
      - name: Validate authenticated Controller protocol and publication contract
        run: >-
          php vendor/bin/phpunit
          --bootstrap app/code/Weline/Server/Test/bootstrap_pgsql.php
          app/code/Weline/Server/Test/Integration/Service/Edge/Gateway/GatewayHostManagerAsyncPublicationTest.php
          app/code/Weline/Server/Test/Integration/Service/Edge/Gateway/GatewayProtocolSecurityTest.php
      - name: Validate shared-state authority, token and transport lifecycle
        run: >-
          php vendor/bin/phpunit
          --bootstrap app/code/Weline/Server/Test/bootstrap_pgsql.php
          app/code/Weline/Server/Test/Session/SessionServerIntegrationTest.php
          app/code/Weline/Server/Test/Unit/Service/SharedStateGenerationAndRecoveryTest.php
          app/code/Weline/Server/Test/Unit/Service/SharedStateProtocolProbeTest.php
          app/code/Weline/Server/Test/Unit/Service/SharedStateRuntimeResolverTest.php
          app/code/Weline/Server/Test/Unit/Service/SharedStateRuntimeScopeTest.php
          app/code/Weline/Server/Test/Unit/Service/SharedStateServiceLifecycleTest.php
          app/code/Weline/Server/Test/Unit/Service/SharedStateServiceManagerMonotonicTimingTest.php
          app/code/Weline/Server/Test/Unit/Service/SharedStateServiceManagerTest.php
          app/code/Weline/Server/Test/Unit/Service/StateFacadeInitializationTest.php
          app/code/Weline/Server/Test/Unit/Session/SessionServerSharedConsumerConsensusTest.php
          app/code/Weline/Server/Test/Unit/Session/SessionServerShutdownCommandTest.php
          app/code/Weline/Server/Test/Unit/Session/SessionServerTokenCleanupTest.php
          app/code/Weline/Server/Test/Unit/Session/SharedStateTokenStoreTest.php
          app/code/Weline/Server/Test/Unit/Shared/Client/SharedStateClientTest.php
          app/code/Weline/Server/Test/Unit/Shared/Connection/ConnectionPoolManagerFiberLeaseTest.php
          app/code/Weline/Server/Test/Unit/Shared/Connection/ConnectionPoolManagerOptionsMergeTest.php
          app/code/Weline/Server/Test/Unit/Shared/Connection/PooledConnectionTokenRotationTest.php
      - name: Validate package schema and builder syntax
        run: |
          php -l dev/tools/wls-gateway-package.php
          php -r 'json_decode(file_get_contents("app/code/Weline/Server/env/gateway/package-manifest.schema.json"), true, 512, JSON_THROW_ON_ERROR);'

  platform-runtime-contract:
    name: ${{ matrix.platform }} ${{ matrix.arch }} process and listener contracts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: Linux
            arch: x86_64
            extensions: sodium, openssl, sockets, pcntl
          - runner: ubuntu-24.04-arm
            platform: Linux
            arch: arm64
            extensions: sodium, openssl, sockets, pcntl
          - runner: macos-15-intel
            platform: Darwin
            arch: x86_64
            extensions: sodium, openssl, sockets, pcntl
          - runner: macos-15
            platform: Darwin
            arch: arm64
            extensions: sodium, openssl, sockets, pcntl
          - runner: windows-2025
            platform: Windows
            arch: x86_64
            extensions: sodium, openssl, sockets
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: "8.4"
          extensions: ${{ matrix.extensions }}
          coverage: none
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify platform runtime target
        shell: pwsh
        run: |
          $targetCheck = @'
            $actualArch = match (strtolower(php_uname("m"))) {
                "amd64", "x86_64" => "x86_64",
                "aarch64", "arm64" => "arm64",
                default => strtolower(php_uname("m")),
            };
            if (PHP_OS_FAMILY !== $argv[1] || $actualArch !== $argv[2]) {
                fwrite(STDERR, "Runtime runner does not match its declared target.\n");
                exit(1);
            }
          '@
          & php -r $targetCheck '${{ matrix.platform }}' '${{ matrix.arch }}'
          if ($LASTEXITCODE -ne 0) {
            throw "Runtime runner does not match its declared target."
          }
      - name: Validate database-independent platform runtime contracts
        shell: pwsh
        run: >-
          php vendor/bin/phpunit
          --bootstrap vendor/autoload.php
          app/code/Weline/Framework/Test/Unit/System/Process/ProcesserDetachedSpawnSecurityTest.php
          app/code/Weline/Framework/Test/Unit/System/Process/ProcesserMonotonicClockContractTest.php
          app/code/Weline/Framework/Test/Unit/System/Process/ProcesserUnixBatchLauncherHandshakeTest.php
          app/code/Weline/Framework/Test/Unit/System/Process/ProcesserWindowsIsolatedBatchReaperTest.php
          app/code/Weline/Server/Test/Unit/Runtime/WindowsListenerHandoffTest.php
          app/code/Weline/Server/Test/Unit/Service/Edge/Gateway/GatewayPlatformServiceInstallerSafetyTest.php
          app/code/Weline/Server/Test/Unit/Service/Edge/Gateway/GatewayPlatformRetirementRecoverySourceTest.php

  native-gate:
    name: Native runtime gate for this commit
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.assemble_release }}
    uses: ./.github/workflows/wls-gateway-native.yml
    permissions:
      contents: read

  assemble-production:
    name: Signed ${{ inputs.target_profile }} package
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.assemble_release }}
    needs:
      - package-contract
      - platform-runtime-contract
      - native-gate
    runs-on: ${{ inputs.target_profile == 'linux-x86_64' && 'ubuntu-24.04' || inputs.target_profile == 'linux-arm64' && 'ubuntu-24.04-arm' || inputs.target_profile == 'darwin-x86_64' && 'macos-15-intel' || inputs.target_profile == 'darwin-arm64' && 'macos-15' || inputs.target_profile == 'windows-x86_64' && 'windows-2025' || 'wls-invalid-target-profile' }}
    timeout-minutes: 45
    env:
      COMPONENT_BASE_URL: ${{ vars.WLS_GATEWAY_COMPONENT_BASE_URL }}
      WLS_RELEASE_VERSION: ${{ inputs.version }}
      WLS_TARGET_PLATFORM: ${{ startsWith(inputs.target_profile, 'linux-') && 'Linux' || startsWith(inputs.target_profile, 'darwin-') && 'Darwin' || startsWith(inputs.target_profile, 'windows-') && 'Windows' || '' }}
      WLS_TARGET_ARCH: ${{ endsWith(inputs.target_profile, '-arm64') && 'arm64' || 'x86_64' }}
      WLS_PROVENANCE_SHA256: ${{ inputs.provenance_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: "8.4"
          extensions: sodium, openssl
          coverage: none
      - name: Validate release inputs
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:COMPONENT_BASE_URL)) {
            throw "WLS_GATEWAY_COMPONENT_BASE_URL is required."
          }
          $componentUri = [Uri]$env:COMPONENT_BASE_URL
          if ($componentUri.Scheme -ne "https") {
            throw "The release component store must use HTTPS."
          }
          if ($env:WLS_RELEASE_VERSION -cnotmatch '\A[0-9A-Za-z][0-9A-Za-z._+-]{0,63}\z') {
            throw "The WLS Gateway release version is invalid."
          }
          if ($env:WLS_PROVENANCE_SHA256 -cnotmatch '\A[a-f0-9]{64}\z') {
            throw "An approved lowercase provenance SHA-256 is required."
          }
          if ($env:WLS_TARGET_PLATFORM -notin @('Linux', 'Darwin', 'Windows') -or
              $env:WLS_TARGET_ARCH -notin @('x86_64', 'arm64') -or
              '${{ inputs.target_profile }}' -notin @(
                'linux-x86_64', 'linux-arm64', 'darwin-x86_64',
                'darwin-arm64', 'windows-x86_64'
              )) {
            throw "The requested package target is invalid."
          }
          $targetCheck = @'
            $expectedPlatform = $argv[1];
            $expectedArch = $argv[2];
            $actualArch = match (strtolower(php_uname("m"))) {
                "amd64", "x86_64" => "x86_64",
                "aarch64", "arm64" => "arm64",
                default => strtolower(php_uname("m")),
            };
            if (PHP_OS_FAMILY !== $expectedPlatform || $actualArch !== $expectedArch) {
                fwrite(STDERR, "Runner target does not match requested WLS Gateway package.\n");
                exit(1);
            }
          '@
          & php -r $targetCheck $env:WLS_TARGET_PLATFORM $env:WLS_TARGET_ARCH
          if ($LASTEXITCODE -ne 0) {
            throw "Runner target does not match the requested package."
          }
      - name: Download approved locked components
        shell: pwsh
        run: |
          $componentDir = Join-Path $env:RUNNER_TEMP "wls-gateway-components"
          $binDir = Join-Path $componentDir "bin"
          New-Item -ItemType Directory -Path $binDir | Out-Null
          $suffix = if ($env:WLS_TARGET_PLATFORM -eq 'Windows') { '.exe' } else { '' }
          $target = "$($env:WLS_TARGET_PLATFORM)-$($env:WLS_TARGET_ARCH)"
          $versionSegment = [Uri]::EscapeDataString($env:WLS_RELEASE_VERSION)
          $base = "$($env:COMPONENT_BASE_URL.TrimEnd('/'))/$versionSegment/$target"
          $curl = if ($IsWindows) {
            (Get-Command curl.exe -ErrorAction Stop).Source
          } else {
            (Get-Command curl -ErrorAction Stop).Source
          }
          function Receive-TrustedFile([string]$uri, [string]$destination) {
            & $curl --fail --location --proto '=https' --proto-redir '=https' `
              --tlsv1.2 --connect-timeout 15 --max-time 300 --max-filesize 536870912 `
              --retry 3 --retry-all-errors $uri --output $destination
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to download an approved WLS Gateway component."
            }
          }
          $components = @('php', 'nginx', 'wls-gateway-broker', 'wls-gateway-launcher')
          if ($env:WLS_TARGET_PLATFORM -eq 'Windows') {
            $components += 'wls-bounded-command'
          }
          foreach ($component in $components) {
            $destination = Join-Path $binDir "$component$suffix"
            Receive-TrustedFile "$base/bin/$component$suffix" $destination
          }
          $provenance = Join-Path $componentDir "provenance.json"
          Receive-TrustedFile "$base/provenance.json" $provenance
          Receive-TrustedFile "$base/LICENSES.txt" (Join-Path $componentDir "LICENSES.txt")
          $actual = (Get-FileHash -Algorithm SHA256 -Path $provenance).Hash.ToLowerInvariant()
          if ($actual -cne $env:WLS_PROVENANCE_SHA256) {
            throw "Approved provenance digest does not match the downloaded file."
          }
          if ($env:WLS_TARGET_PLATFORM -ne 'Windows') {
            foreach ($componentFile in Get-ChildItem -LiteralPath $binDir -File) {
              & chmod 0755 $componentFile.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to apply executable component modes."
              }
            }
          }
      - name: Assemble unsigned immutable candidate
        shell: pwsh
        run: |
          $componentDir = Join-Path $env:RUNNER_TEMP "wls-gateway-components"
          $packageDir = Join-Path $env:RUNNER_TEMP "wls-gateway-package"
          $suffix = if ($env:WLS_TARGET_PLATFORM -eq 'Windows') { '.exe' } else { '' }
          $arguments = @(
            'dev/tools/wls-gateway-package.php',
            "--output=$packageDir",
            '--profile=production',
            "--version=$env:WLS_RELEASE_VERSION",
            "--platform=$env:WLS_TARGET_PLATFORM",
            "--arch=$env:WLS_TARGET_ARCH",
            '--controller=app/code/Weline/Server/bin/wls_gateway_controller.php',
            "--php=$(Join-Path $componentDir "bin/php$suffix")",
            "--nginx=$(Join-Path $componentDir "bin/nginx$suffix")",
            "--wls-gateway-broker=$(Join-Path $componentDir "bin/wls-gateway-broker$suffix")",
            "--wls-gateway-launcher=$(Join-Path $componentDir "bin/wls-gateway-launcher$suffix")",
            "--licenses=$(Join-Path $componentDir 'LICENSES.txt')",
            "--provenance=$(Join-Path $componentDir 'provenance.json')"
          )
          if ($env:WLS_TARGET_PLATFORM -eq 'Windows') {
            $arguments += "--wls-bounded-command=$(Join-Path $componentDir 'bin/wls-bounded-command.exe')"
          }
          & php @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "WLS Gateway package assembly failed."
          }
          $manifest = Get-Content -Raw (Join-Path $packageDir 'manifest.json') | ConvertFrom-Json
          if ($manifest.release_ready -ne $false -or $manifest.package_profile -ne 'production') {
            throw "Assembly must produce a non-ready production candidate."
          }
      - name: Stage the protected signer implementation bundle
        shell: pwsh
        run: |
          $signerRoot = Join-Path $env:RUNNER_TEMP "wls-gateway-signer"
          $files = @(
            'app/code/Weline/Server/Service/Edge/Gateway/GatewayBoundedCommandRunner.php',
            'app/code/Weline/Server/Service/Edge/Gateway/GatewayBoundedTreeWalker.php',
            'app/code/Weline/Server/Service/Edge/Gateway/GatewayProjectStateFilesystem.php',
            'app/code/Weline/Server/env/gateway/trusted-release-keys.json',
            'dev/tools/wls-gateway-package.php'
          )
          foreach ($relative in $files) {
            $destination = Join-Path $signerRoot $relative
            New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
            Copy-Item -LiteralPath $relative -Destination $destination -ErrorAction Stop
          }
      - name: Upload unsigned candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wls-gateway-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wls-gateway-package
          if-no-files-found: error
          retention-days: 1
      - name: Upload protected signer implementation bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wls-gateway-signer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wls-gateway-signer
          if-no-files-found: error
          retention-days: 1

  audit-production:
    name: Audit immutable candidate without release secrets
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.assemble_release }}
    needs: assemble-production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AUDITOR_IMAGE_REFERENCE: ${{ vars.WLS_GATEWAY_AUDITOR_IMAGE }}
      EXPECTED_SIGNER_BUNDLE_SHA256: ${{ vars.WLS_GATEWAY_SIGNER_BUNDLE_SHA256 }}
      EXPECTED_AUDIT_ENVIRONMENT_SHA256: ${{ inputs.target_profile == 'linux-x86_64' && vars.WLS_GATEWAY_AUDIT_ENVIRONMENT_SHA256_LINUX_X86_64 || inputs.target_profile == 'linux-arm64' && vars.WLS_GATEWAY_AUDIT_ENVIRONMENT_SHA256_LINUX_ARM64 || inputs.target_profile == 'darwin-x86_64' && vars.WLS_GATEWAY_AUDIT_ENVIRONMENT_SHA256_DARWIN_X86_64 || inputs.target_profile == 'darwin-arm64' && vars.WLS_GATEWAY_AUDIT_ENVIRONMENT_SHA256_DARWIN_ARM64 || inputs.target_profile == 'windows-x86_64' && vars.WLS_GATEWAY_AUDIT_ENVIRONMENT_SHA256_WINDOWS_X86_64 || '' }}
    steps:
      - name: Verify auditor image digest before any container start
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$AUDITOR_IMAGE_REFERENCE" =~ ^([^[:space:]@]+)@sha256:([a-f0-9]{64})$ ]]; then
            echo "WLS_GATEWAY_AUDITOR_IMAGE must be an immutable digest reference." >&2
            exit 1
          fi
          expected_digest="${BASH_REMATCH[2]}"
          docker pull --quiet "$AUDITOR_IMAGE_REFERENCE"
          resolved="$(docker image inspect --format '{{index .RepoDigests 0}}' "$AUDITOR_IMAGE_REFERENCE")"
          if [[ ! "$resolved" =~ @sha256:([a-f0-9]{64})$ ]]; then
            echo "Pulled auditor image did not resolve to a digest." >&2
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != "$expected_digest" ]]; then
            echo "Pulled auditor image digest does not match the allowlisted reference." >&2
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wls-gateway-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wls-gateway-package
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wls-gateway-signer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wls-gateway-signer
      - name: Verify immutable signer bundle
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SIGNER_BUNDLE_SHA256" =~ ^[a-f0-9]{64}$ ]] ||
             [[ ! "$EXPECTED_AUDIT_ENVIRONMENT_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Protected signer/auditor allowlist digests are required." >&2
            exit 1
          fi
          signer_root="$RUNNER_TEMP/wls-gateway-signer"
          records="$RUNNER_TEMP/wls-gateway-signer.records"
          : > "$records"
          for relative in \
            app/code/Weline/Server/Service/Edge/Gateway/GatewayBoundedCommandRunner.php \
            app/code/Weline/Server/Service/Edge/Gateway/GatewayBoundedTreeWalker.php \
            app/code/Weline/Server/Service/Edge/Gateway/GatewayProjectStateFilesystem.php \
            app/code/Weline/Server/env/gateway/trusted-release-keys.json \
            dev/tools/wls-gateway-package.php
          do
            file="$signer_root/$relative"
            if [[ ! -f "$file" || -L "$file" ]]; then
              echo "Signer bundle file is missing, linked, or special: $relative" >&2
              exit 1
            fi
            size="$(wc -c < "$file" | tr -d '[:space:]')"
            digest="$(sha256sum "$file" | awk '{print $1}')"
            printf '%s\t%s\t%s\n' "$relative" "$size" "$digest" >> "$records"
          done
          actual="$(sha256sum "$records" | awk '{print $1}')"
          if [[ "$actual" != "$EXPECTED_SIGNER_BUNDLE_SHA256" ]]; then
            echo "Signer implementation bundle does not match the protected digest." >&2
            exit 1
          fi
      - name: Audit candidate inside the verified auditor image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --cap-drop=ALL --security-opt=no-new-privileges \
            -v "$RUNNER_TEMP/wls-gateway-package:/package:ro" \
            -v "$RUNNER_TEMP/wls-gateway-signer:/signer:ro" \
            -v "$RUNNER_TEMP:/out" \
            "$AUDITOR_IMAGE_REFERENCE" \
            php /signer/dev/tools/wls-gateway-package.php \
              --mode=audit \
              --package=/package \
              --receipt-output=/out/wls-gateway-dependency-audit.json \
              "--expected-audit-environment-sha256=$EXPECTED_AUDIT_ENVIRONMENT_SHA256"
      - name: Upload candidate-bound dependency audit receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wls-gateway-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wls-gateway-dependency-audit.json
          if-no-files-found: error
          retention-days: 1

  sign-production:
    name: Sign approved package without executing components
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.assemble_release }}
    needs:
      - assemble-production
      - audit-production
      - native-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: wls-gateway-release
    env:
      RELEASE_KEY_ID: ${{ vars.WLS_GATEWAY_RELEASE_KEY_ID }}
      WLS_TARGET_PLATFORM: ${{ startsWith(inputs.target_profile, 'linux-') && 'Linux' || startsWith(inputs.target_profile, 'darwin-') && 'Darwin' || startsWith(inputs.target_profile, 'windows-') && 'Windows' || '' }}
      SIGNER_IMAGE_REFERENCE: ${{ vars.WLS_GATEWAY_SIGNER_IMAGE }}
      EXPECTED_SIGNER_BUNDLE_SHA256: ${{ vars.WLS_GATEWAY_SIGNER_BUNDLE_SHA256 }}
      EXPECTED_AUDIT_ENVIRONMENT_SHA256: ${{ inputs.target_profile == 'linux-x86_64' && vars.WLS_GATEWAY_AUDIT_ENVIRONMENT_SHA256_LINUX_X86_64 || inputs.target_profile == 'linux-arm64' && vars.WLS_GATEWAY_AUDIT_ENVIRONMENT_SHA256_LINUX_ARM64 || inputs.target_profile == 'darwin-x86_64' && vars.WLS_GATEWAY_AUDIT_ENVIRONMENT_SHA256_DARWIN_X86_64 || inputs.target_profile == 'darwin-arm64' && vars.WLS_GATEWAY_AUDIT_ENVIRONMENT_SHA256_DARWIN_ARM64 || inputs.target_profile == 'windows-x86_64' && vars.WLS_GATEWAY_AUDIT_ENVIRONMENT_SHA256_WINDOWS_X86_64 || '' }}
      PROTECTED_REF: ${{ github.ref_protected }}
    steps:
      - name: Verify signer image digest before any container start
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SIGNER_IMAGE_REFERENCE" =~ ^([^[:space:]@]+)@sha256:([a-f0-9]{64})$ ]]; then
            echo "WLS_GATEWAY_SIGNER_IMAGE must be an immutable digest reference." >&2
            exit 1
          fi
          expected_digest="${BASH_REMATCH[2]}"
          docker pull --quiet "$SIGNER_IMAGE_REFERENCE"
          resolved="$(docker image inspect --format '{{index .RepoDigests 0}}' "$SIGNER_IMAGE_REFERENCE")"
          if [[ ! "$resolved" =~ @sha256:([a-f0-9]{64})$ ]]; then
            echo "Pulled signer image did not resolve to a digest." >&2
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != "$expected_digest" ]]; then
            echo "Pulled signer image digest does not match the allowlisted reference." >&2
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wls-gateway-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wls-gateway-package
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wls-gateway-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wls-gateway-audit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wls-gateway-signer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wls-gateway-signer
      - name: Verify immutable signer bundle
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SIGNER_BUNDLE_SHA256" =~ ^[a-f0-9]{64}$ ]] ||
             [[ ! "$EXPECTED_AUDIT_ENVIRONMENT_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Protected signer/auditor allowlist digests are required." >&2
            exit 1
          fi
          signer_root="$RUNNER_TEMP/wls-gateway-signer"
          records="$RUNNER_TEMP/wls-gateway-signer.records"
          : > "$records"
          for relative in \
            app/code/Weline/Server/Service/Edge/Gateway/GatewayBoundedCommandRunner.php \
            app/code/Weline/Server/Service/Edge/Gateway/GatewayBoundedTreeWalker.php \
            app/code/Weline/Server/Service/Edge/Gateway/GatewayProjectStateFilesystem.php \
            app/code/Weline/Server/env/gateway/trusted-release-keys.json \
            dev/tools/wls-gateway-package.php
          do
            file="$signer_root/$relative"
            if [[ ! -f "$file" || -L "$file" ]]; then
              echo "Signer bundle file is missing, linked, or special: $relative" >&2
              exit 1
            fi
            size="$(wc -c < "$file" | tr -d '[:space:]')"
            digest="$(sha256sum "$file" | awk '{print $1}')"
            printf '%s\t%s\t%s\n' "$relative" "$size" "$digest" >> "$records"
          done
          actual="$(sha256sum "$records" | awk '{print $1}')"
          if [[ "$actual" != "$EXPECTED_SIGNER_BUNDLE_SHA256" ]]; then
            echo "Signer implementation bundle does not match the protected digest." >&2
            exit 1
          fi
      - name: Sign verified hashes inside the verified signer image
        shell: bash
        env:
          WLS_GATEWAY_RELEASE_SECRET_KEY_BASE64: ${{ secrets.WLS_GATEWAY_RELEASE_SECRET_KEY_BASE64 }}
        run: |
          set -euo pipefail
          trap 'unset WLS_GATEWAY_RELEASE_SECRET_KEY_BASE64' EXIT
          if [[ "$PROTECTED_REF" != "true" ]]; then
            echo "Production signing is allowed only from a protected ref." >&2
            exit 1
          fi
          if [[ -z "$RELEASE_KEY_ID" || -z "$WLS_GATEWAY_RELEASE_SECRET_KEY_BASE64" ]]; then
            echo "The protected release key id and secret are required." >&2
            exit 1
          fi
          docker_args=(
            --rm --network none
            --cap-drop=ALL --security-opt=no-new-privileges
            -e WLS_GATEWAY_RELEASE_SECRET_KEY_BASE64
            -e RELEASE_KEY_ID
            -e WLS_TARGET_PLATFORM
            -e EXPECTED_AUDIT_ENVIRONMENT_SHA256
            -e PROTECTED_REF
            -v "$RUNNER_TEMP/wls-gateway-package:/package"
            -v "$RUNNER_TEMP/wls-gateway-audit:/audit:ro"
            -v "$RUNNER_TEMP/wls-gateway-signer:/signer:ro"
            -v "$RUNNER_TEMP:/out"
            "$SIGNER_IMAGE_REFERENCE"
          )
          sign_args=(
            php /signer/dev/tools/wls-gateway-package.php
            --mode=sign
            --package=/package
            --audit-receipt=/audit/wls-gateway-dependency-audit.json
            "--expected-audit-environment-sha256=$EXPECTED_AUDIT_ENVIRONMENT_SHA256"
            "--signing-key-id=$RELEASE_KEY_ID"
            --signing-key-environment=WLS_GATEWAY_RELEASE_SECRET_KEY_BASE64
            --trusted-keys=/signer/app/code/Weline/Server/env/gateway/trusted-release-keys.json
          )
          if [[ "$WLS_TARGET_PLATFORM" == "Windows" ]]; then
            sign_args+=(--bootstrap-output=/out/wls-windows-bounded-command-bootstrap)
          fi
          docker run "${docker_args[@]}" "${sign_args[@]}"
          unset WLS_GATEWAY_RELEASE_SECRET_KEY_BASE64
          python3 -c '
          import json, pathlib, sys
          manifest = json.loads(pathlib.Path("'"$RUNNER_TEMP"'/wls-gateway-package/manifest.json").read_text(encoding="utf-8"))
          if manifest.get("release_ready") is not True or manifest.get("package_profile") != "production":
              print("The isolated signing gate did not produce a release-ready package.", file=sys.stderr)
              raise SystemExit(1)
          '
      - name: Upload signed package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wls-gateway-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wls-gateway-package
          if-no-files-found: error
          retention-days: 30
      - name: Upload signed Windows pure-WLS bootstrap helper
        if: ${{ inputs.target_profile == 'windows-x86_64' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wls-windows-bounded-command-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wls-windows-bounded-command-bootstrap
          if-no-files-found: error
          retention-days: 30
