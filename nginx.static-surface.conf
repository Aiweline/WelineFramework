# =============================================================================
# Weline —— 静态公共面统一口径（权威样例）
# -----------------------------------------------------------------------------
# 唯一权威在 PHP 侧：Weline\Framework\Deploy\StaticPublicSurface
#   - SERVABLE_EXTENSIONS      → 下面的「扩展名白名单」正则
#   - StaticPublishExclusion   → 下面的「拒绝规则」（脚本/模板/清单文件）
# 本文件的两份正则必须与 PHP 侧一致，由契约测试
#   Framework/Test/Unit/Deploy/StaticPublicSurfaceContractTest 锁定；
# 改了 PHP 侧请重新生成这两处，不要手改。
#
# -----------------------------------------------------------------------------
# 前置条件（请在 include 本文件之前的 server 块里设置）
# -----------------------------------------------------------------------------
#   set $WELINE_PUB_ROOT /www/wwwroot/example.com/pub;
#   root $WELINE_PUB_ROOT;
#
# 即：Web 根 = pub/（「pub 这层转化」的落点）。对外路径仍为 /static/、/media/，
# 版本化前缀 /s/{deploy_version}/ 由本文件映射到 pub/static/。
#
# -----------------------------------------------------------------------------
# ⚠️ 两条必须知道的 nginx 匹配规则（本文件所有写法都围绕它们）
# -----------------------------------------------------------------------------
# 1) location 优先级：`=` > `^~`（最长前缀，命中后**跳过所有正则**）>
#    正则 `~`/`~*`（**按文件中出现顺序，首个命中者胜**）> 普通前缀。
# 2) 因此：只要站点配置里存在 `location ^~ /s/20260914/`，它就会**绕过**一切
#    正则 deny，包括写在任何位置的 `location ~ \.php$ { deny all; }`。
#
#    ⇒ 硬要求：**站点配置不得自己手写静态 `^~` 块**；静态面全部由本文件拥有。
#      若托管面板（宝塔等）坚持生成 `^~`，必须把本文件末尾「附：^~ 变体」里的
#      `if` 原样贴进那个 `^~` 块内部（嵌套 location/if 会被求值，^~ 绕不过它）。
#
# =============================================================================


# -----------------------------------------------------------------------------
# 0) 拒绝规则（纵深防御·第一道）
#    脚本 / 模板 / 服务端可执行扩展名一律 403。
#    必须放在 PHP-FPM 的 `location ~ \.php$` **之前**，否则 .php 会先被交给 PHP 执行。
# -----------------------------------------------------------------------------
location ~* ^/(?:static|s/[0-9]{8}|media|sitemaps|errors|theme_previews)/.*\.(?:php|phtml|pht|phps|phar|php3|php4|php5|php7|php8|cgi|fcgi|pl|py|rb|sh|bash|zsh|asp|aspx|jsp|jspx|shtml)(?:$|\.) {
    deny all;
    access_log off;
    log_not_found off;
}

# 版本库 / 工具链元数据目录（即便里面是 .js/.css 也不该对外）
location ~* ^/(?:static|s/[0-9]{8}|media)/.*/(?:\.git|\.github|\.gitlab|node_modules|bower_components|nuget)/(?:.*)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# 包管理 / 构建 / Lint 清单：无运行时价值，且常含内部依赖与脚本路径
location ~* ^/(?:static|s/[0-9]{8}|media)/.*/(?:package|package-lock|npm-shrinkwrap|yarn|pnpm-lock|composer|composer\.lock|bower|gruntfile|gulpfile|webpack\.config|rollup\.config|vite\.config|karma\.conf|jest\.config|tsconfig)\.(?:json|js|lock|yaml)$ {
    deny all;
    access_log off;
    log_not_found off;
}


# -----------------------------------------------------------------------------
# 1) 编译产物树：/static/
#    白名单之外一律 404（默认拒绝）——一次性挡掉 .scss / .less / .ts / .hbs /
#    .sql / .lock / Makefile 等构建残留。
#    白名单正则 = StaticPublicSurface::servableExtensionPattern()
# -----------------------------------------------------------------------------
location ~ ^/static/ {
    root $WELINE_PUB_ROOT;

    # ▼▼▼ 生成物：与 PHP 侧 SERVABLE_EXTENSIONS 一致，勿手改 ▼▼▼
    if ($uri !~* "\.(?:css|js|mjs|map|json|xml|txt|webmanifest|html|htm|jpg|jpeg|jfif|png|gif|webp|avif|svg|ico|bmp|woff|woff2|eot|ttf|otf|mp4|mp3|m4a|aac|webm|ogg|m3u8|wav|pdf|doc|docx|xls|xlsx|ppt|pptx|zip|rar|7z|gz|tar|swf)$") {
        return 404;
    }
    # ▲▲▲ 生成物结束 ▲▲▲

    expires 10d;
    access_log off;
    log_not_found off;
}


# -----------------------------------------------------------------------------
# 2) 版本化对外前缀：/s/{deploy_version}/  →  pub/static/
#    生产用 sub_filter 把页面里的 "/static/" 改写成 "/s/20260914/" 以便长缓存。
#    它是**主要**对外前缀，历史上却完全没有过滤，是最容易被遗忘的一环。
#    因带版本号，可安全设置 immutable 长缓存。
# -----------------------------------------------------------------------------
location ~ ^/s/[0-9]{8}/(?P<weline_asset>.*)$ {
    # 正则 location 里的 alias 必须带捕获，否则 nginx 拒绝加载
    alias $WELINE_PUB_ROOT/static/$weline_asset;

    # ▼▼▼ 生成物：与 PHP 侧 SERVABLE_EXTENSIONS 一致，勿手改 ▼▼▼
    if ($uri !~* "\.(?:css|js|mjs|map|json|xml|txt|webmanifest|html|htm|jpg|jpeg|jfif|png|gif|webp|avif|svg|ico|bmp|woff|woff2|eot|ttf|otf|mp4|mp3|m4a|aac|webm|ogg|m3u8|wav|pdf|doc|docx|xls|xlsx|ppt|pptx|zip|rar|7z|gz|tar|swf)$") {
        return 404;
    }
    # ▲▲▲ 生成物结束 ▲▲▲

    # 带 deploy_version，可安全长缓存（`expires` 会同时输出 Expires 与
    # Cache-Control；不要再 add_header Cache-Control，否则会出现重复头）
    expires 1y;
    access_log off;
    log_not_found off;
}


# -----------------------------------------------------------------------------
# 3) 媒体 / 站点地图 / 错误页 / 主题预览：只套拒绝规则，不套扩展名白名单
#    原因：这些空间里的文件可能没有扩展名（如 .well-known/acme-challenge/xxx），
#    套白名单会打断 ACME 校验；但 .php 之类仍由第 0 节挡掉。
# -----------------------------------------------------------------------------
location ^~ /media/ {
    root $WELINE_PUB_ROOT;
    expires 30d;
    access_log off;
    log_not_found off;
}

# 站点地图会随内容变化：短缓存 + 必须回源校验
location ^~ /sitemaps/ {
    root $WELINE_PUB_ROOT;
    add_header Cache-Control "public, max-age=86400, must-revalidate";
    access_log off;
}

location ^~ /errors/ {
    root $WELINE_PUB_ROOT;
    internal;                      # 只供 error_page 内部跳转，不允许直接访问
}

location ^~ /.well-known/ {
    root $WELINE_PUB_ROOT;
    allow all;                     # ACME / 证书校验目录
    default_type "text/plain";
    access_log off;
}

location ^~ /theme_previews/ {
    root $WELINE_PUB_ROOT;
    add_header Cache-Control "no-store";
    access_log off;
}


# -----------------------------------------------------------------------------
# 附：`^~` 变体（仅当托管面板强制生成 `^~` 静态块时使用）
# -----------------------------------------------------------------------------
# `^~` 会跳过一切正则，所以第 0/1/2 节对它全部无效。此时必须把下面这段**原样**
# 贴进面板生成的每一个静态 `^~` 块内部（嵌套 if 在 ^~ 内部仍会被求值）：
#
#   location ^~ /s/20260914/ {
#       alias $WELINE_PUB_ROOT/static/;
#
#       # 与 PHP 侧 SERVABLE_EXTENSIONS 一致，勿手改
#       if ($uri !~* "\.(?:css|js|mjs|map|json|xml|txt|webmanifest|html|htm|jpg|jpeg|jfif|png|gif|webp|avif|svg|ico|bmp|woff|woff2|eot|ttf|otf|mp4|mp3|m4a|aac|webm|ogg|m3u8|wav|pdf|doc|docx|xls|xlsx|ppt|pptx|zip|rar|7z|gz|tar|swf)$") {
#           return 404;
#       }
#
#       expires 1y;
#   }
#
# 更好的做法：删掉面板里的静态 `^~` 块，只保留 `include` 本文件，让静态面
# 只有一个拥有者 —— 这才是「统一口径」。
# =============================================================================
