<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">WelineFramework</title>
  <desc id="desc">Open Graph preview card for WelineFramework.</desc>
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="72" y="72" width="1056" height="486" rx="32" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>
