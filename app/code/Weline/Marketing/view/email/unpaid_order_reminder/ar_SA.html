<!-- mail:preheader: طلبك ما زال غير مدفوع -->
<h1 style="margin:0 0 16px;font-family:Georgia,'Iowan Old Style',Palatino,'Palatino Linotype',serif;font-size:26px;line-height:1.25;font-weight:600;color:#16333f;">طلبك ما زال غير مدفوع</h1>
            <div style="font-size:15px;line-height:1.7;color:#33434c;">
<p style="margin:0 0 12px;">مرحبًا {{var.customer_name}}،</p>
<p style="margin:0 0 12px;">الطلب <strong>{{var.order_number}}</strong> ما زال بانتظار الدفع. إن رغبت بالمنتجات فأكمل عبر الرابط.</p>
            </div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:20px 0 8px;border-collapse:collapse;"><tr><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#5c6b74;font-size:13px;width:38%;">رقم الطلب</td><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#1c2a32;font-size:13px;font-weight:600;">{{var.order_number}}</td></tr><tr><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#5c6b74;font-size:13px;width:38%;">الإجمالي</td><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#1c2a32;font-size:13px;font-weight:600;">{{var.currency}} {{var.grand_total}}</td></tr><tr><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#5c6b74;font-size:13px;width:38%;">تاريخ الطلب</td><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#1c2a32;font-size:13px;font-weight:600;">{{var.created_at}}</td></tr></table>
<p style="margin:24px 0 0;">{{#if var.continue_pay_url}}<a href="{{var.continue_pay_url}}" style="display:inline-block;padding:12px 20px;background:#16333f;color:#fff;text-decoration:none;border-radius:4px;">متابعة الدفع</a>{{/if}}</p>
