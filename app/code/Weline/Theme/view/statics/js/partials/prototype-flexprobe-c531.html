(function(){
  const inner=document.querySelector('.header-main-nav-inner');
  const list=document.getElementById('categories-list');
  const cats=Array.from(list.children);
  const R=document.querySelector('.header-nav-right-cluster');
  const navKids=Array.from(R.querySelectorAll(':scope > a, :scope > ul > li'));
  const MORE_W=62;
  function natural(el){ return el.getBoundingClientRect().width; } // display:none 会归零，先量后藏
  function fold(){
    // reset
    cats.forEach(c=>c.style.display=''); navKids.forEach(n=>n.style.display='');
    const W=inner.clientWidth, gap=12;
    const navNatSum=navKids.reduce((s,n)=>s+natural(n),0)+(navKids.length-1)*20;
    const catNat=cats.map(natural); const catSum=catNat.reduce((s,w)=>s+w,0)+(cats.length-1)*8;
    // 左先塌：catAvail = W − navNat(含其More预留) − gap
    let catAvail=Math.max(0,W-(navNatSum+MORE_W)-gap), used=0, hideFrom=-1;
    for(let i=0;i<cats.length;i++){ const need=catNat[i]+(used>0?8:0); if(used+need+(i<cats.length-1?MORE_W:0)<=catAvail){used+=need;} else {hideFrom=i;break;} }
    if(hideFrom>=0){ cats.slice(hideFrom).forEach(c=>c.style.display='none'); used+=MORE_W; }
    // 右再塌：navAvail = W − leftShown − gap
    const navAvail=Math.max(0,W-used-gap);
    let nUsed=0, nHide=-1; const navNat=navKids.map(natural);
    for(let i=0;i<navKids.length;i++){ const need=navNat[i]+(nUsed>0?20:0); if(nUsed+need+(i<navKids.length-1?MORE_W:0)<=navAvail){nUsed+=need;} else {nHide=i;break;} }
    if(nHide>=0){ navKids.slice(nHide).forEach(n=>n.style.display='none'); }
    return {W, catAvail:Math.round(catAvail), hideCat:hideFrom, leftShown:Math.round(used), navAvail:Math.round(navAvail), hideNav:nHide};
  }
  window.__foldResult=fold();
  const pre=document.createElement('pre'); pre.textContent=JSON.stringify(window.__foldResult); document.body.appendChild(pre);
})();
