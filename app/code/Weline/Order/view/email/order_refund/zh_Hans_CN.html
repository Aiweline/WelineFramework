<!-- mail:preheader: 退款通知 -->
<h1 style="margin:0 0 16px;font-family:Georgia,'Iowan Old Style',Palatino,'Palatino Linotype',serif;font-size:26px;line-height:1.25;font-weight:600;color:#16333f;">退款通知</h1>
            <div style="font-size:15px;line-height:1.7;color:#33434c;">
<p style="margin:0 0 12px;">您好{{var.customer_name}}，</p>
<p style="margin:0 0 12px;">关于您的订单退款，请查看以下信息。</p>
<p style="margin:0 0 12px;">{{var.message}}</p>
<p style="margin:0;">{{var.comment}}</p>
            </div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:20px 0 8px;border-collapse:collapse;"><tr><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#5c6b74;font-size:13px;width:38%;">订单号</td><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#1c2a32;font-size:13px;font-weight:600;">{{var.order_number}}</td></tr><tr><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#5c6b74;font-size:13px;width:38%;">订单 UUID</td><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#1c2a32;font-size:13px;font-weight:600;">{{var.order_uuid}}</td></tr><tr><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#5c6b74;font-size:13px;width:38%;">客户邮箱</td><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#1c2a32;font-size:13px;font-weight:600;">{{var.customer_email}}</td></tr><tr><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#5c6b74;font-size:13px;width:38%;">状态</td><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#1c2a32;font-size:13px;font-weight:600;">{{var.status}} / {{var.new_status}}</td></tr><tr><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#5c6b74;font-size:13px;width:38%;">金额</td><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#1c2a32;font-size:13px;font-weight:600;">{{var.grand_total}}</td></tr></table>
