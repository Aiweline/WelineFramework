<!-- mail:preheader: 订单已发货 -->
<h1 style="margin:0 0 16px;font-family:Georgia,'Iowan Old Style',Palatino,'Palatino Linotype',serif;font-size:26px;line-height:1.25;font-weight:600;color:#16333f;">订单已发货</h1>
            <div style="font-size:15px;line-height:1.7;color:#33434c;">
<p style="margin:0 0 12px;">您好 {{var.customer_name}}，</p>
<p style="margin:0 0 12px;">好消息：您的订单已发出，请留意物流更新。</p>
{{#if var.message}}<p style="margin:0 0 12px;">{{var.message}}</p>{{/if}}
{{#if var.comment}}<p style="margin:0;">{{var.comment}}</p>{{/if}}
            </div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:20px 0 8px;border-collapse:collapse;"><tr><td style="padding:10px 16px 10px 0;border-bottom:1px solid #e6eef1;color:#5c6b74;font-size:13px;white-space:nowrap;width:1%;vertical-align:top;">订单号</td><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#1c2a32;font-size:13px;font-weight:600;vertical-align:top;word-break:break-word;">{{var.order_number}}</td></tr><tr><td style="padding:10px 16px 10px 0;border-bottom:1px solid #e6eef1;color:#5c6b74;font-size:13px;white-space:nowrap;width:1%;vertical-align:top;">客户邮箱</td><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#1c2a32;font-size:13px;font-weight:600;vertical-align:top;word-break:break-word;">{{var.customer_email}}</td></tr><tr><td style="padding:10px 16px 10px 0;border-bottom:1px solid #e6eef1;color:#5c6b74;font-size:13px;white-space:nowrap;width:1%;vertical-align:top;">状态</td><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#1c2a32;font-size:13px;font-weight:600;vertical-align:top;word-break:break-word;">{{var.status}}{{#if var.new_status}} / {{var.new_status}}{{/if}}</td></tr><tr><td style="padding:10px 16px 10px 0;border-bottom:1px solid #e6eef1;color:#5c6b74;font-size:13px;white-space:nowrap;width:1%;vertical-align:top;">金额</td><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#1c2a32;font-size:13px;font-weight:600;vertical-align:top;word-break:break-word;">{{var.grand_total}}</td></tr></table>
