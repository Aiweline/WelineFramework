<!-- mail:preheader: আপনার অর্ডার নিশ্চিত -->
<h1 style="margin:0 0 16px;font-family:Georgia,'Iowan Old Style',Palatino,'Palatino Linotype',serif;font-size:26px;line-height:1.25;font-weight:600;color:#16333f;">আপনার অর্ডার নিশ্চিত</h1>
            <div style="font-size:15px;line-height:1.7;color:#33434c;">
<p style="margin:0 0 12px;">হ্যালো {{var.customer_name}},</p>
<p style="margin:0 0 12px;">ধন্যবাদ — আপনার অর্ডার তৈরি হয়েছে এবং প্রস্তুত হচ্ছে।</p>
<p style="margin:0 0 12px;">{{var.message}}</p>
<p style="margin:0;">{{var.comment}}</p>
            </div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:20px 0 8px;border-collapse:collapse;"><tr><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#5c6b74;font-size:13px;width:38%;">অর্ডার নং</td><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#1c2a32;font-size:13px;font-weight:600;">{{var.order_number}}</td></tr><tr><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#5c6b74;font-size:13px;width:38%;">অর্ডার UUID</td><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#1c2a32;font-size:13px;font-weight:600;">{{var.order_uuid}}</td></tr><tr><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#5c6b74;font-size:13px;width:38%;">ইমেইল</td><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#1c2a32;font-size:13px;font-weight:600;">{{var.customer_email}}</td></tr><tr><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#5c6b74;font-size:13px;width:38%;">অবস্থা</td><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#1c2a32;font-size:13px;font-weight:600;">{{var.status}} / {{var.new_status}}</td></tr><tr><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#5c6b74;font-size:13px;width:38%;">মোট</td><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#1c2a32;font-size:13px;font-weight:600;">{{var.grand_total}}</td></tr></table>
