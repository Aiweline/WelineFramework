<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <title>PROTOTYPE — CS console chat shell (throwaway)</title>
  <style>
    /* PROTOTYPE ONLY — do not copy hex into production; production uses theme tokens. */
    :root { --chrome: 72px; --gap: 12px; --border: #d8dde6; --muted: #f3f5f8; --primary: #2563eb; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #eef1f6; }
    .bar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 9;
      display: flex; gap: 8px; padding: 8px 12px; background: #111; color: #fff; border-radius: 999px; }
    .bar a { color: #fff; text-decoration: none; padding: 4px 10px; border-radius: 999px; }
    .bar a[aria-current="true"] { background: #fff; color: #111; }
    .stage { height: calc(100vh - var(--chrome)); max-width: 720px; margin: 16px auto; display: flex; flex-direction: column; gap: var(--gap); }
    .note { font-size: 13px; color: #555; padding: 0 4px; }
    .shell { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #fff; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .head, .foot { flex-shrink: 0; padding: 12px 16px; border-color: var(--border); }
    .head { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--muted); }
    .foot { border-top: 1px solid var(--border); display: flex; gap: 8px; }
    .foot input { flex: 1; border-radius: 999px; border: 1px solid var(--border); padding: 10px 14px; }
    .foot button { background: var(--primary); color: #fff; border: 0; border-radius: 999px; padding: 10px 16px; }
    .msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; background: #f7f8fb; }
    .bubble { max-width: 70%; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin: 0 0 12px; }
    /* Variant B: only max-height on msgs (shell grows with page chrome) */
    [data-variant="B"] .shell { flex: none; height: auto; overflow: visible; }
    [data-variant="B"] .msgs { flex: none; max-height: 40vh; }
    /* Variant C: broken current — no min-height:0 / no shell lock */
    [data-variant="C"] .stage { height: auto; }
    [data-variant="C"] .shell { overflow: visible; flex: none; }
    [data-variant="C"] .msgs { overflow: visible; flex: none; min-height: auto; }
  </style>
</head>
<body data-variant="A">
  <!-- Question: 工作台聊天如何不把整卡撑高？ Verdict target: A viewport-locked shell. -->
  <div class="stage">
    <p class="note" id="verdict">Variant A：viewport 锁高壳 — 顶栏/输入钉住，消息区内滚（拟采用）</p>
    <div class="shell">
      <div class="head"><strong>会话 #6</strong><span>关闭会话</span></div>
      <div class="msgs" id="msgs"></div>
      <div class="foot"><input placeholder="输入消息..." /><button type="button">发送</button></div>
    </div>
  </div>
  <nav class="bar" aria-label="prototype variants">
    <a href="?variant=A" data-v="A">A 锁高壳</a>
    <a href="?variant=B" data-v="B">B 仅限高</a>
    <a href="?variant=C" data-v="C">C 撑开(坏)</a>
  </nav>
  <script>
    const v = new URLSearchParams(location.search).get('variant') || 'A';
    document.body.dataset.variant = v;
    document.querySelectorAll('.bar a').forEach(a => a.setAttribute('aria-current', a.dataset.v === v ? 'true' : 'false'));
    const copy = { A: 'Variant A：viewport 锁高壳 — 顶栏/输入钉住，消息区内滚（拟采用）', B: 'Variant B：仅 messages max-height — 可用但与侧栏高度链弱', C: 'Variant C：无 min-height:0 — 消息把整卡撑开（当前坏态）' };
    document.getElementById('verdict').textContent = copy[v] || copy.A;
    const msgs = document.getElementById('msgs');
    for (let i = 1; i <= 24; i++) {
      const d = document.createElement('div');
      d.className = 'bubble';
      d.textContent = '样例消息 #' + i + ' — 用于验证滚动是否落在消息区内部';
      msgs.appendChild(d);
    }
    msgs.scrollTop = msgs.scrollHeight;
  </script>
</body>
</html>
