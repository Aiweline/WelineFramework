<!-- mail:preheader: Verifique su correo vinculado -->
<h1 style="margin:0 0 16px;font-family:Georgia,'Iowan Old Style',Palatino,'Palatino Linotype',serif;font-size:26px;line-height:1.25;font-weight:600;color:#16333f;">Verifique su correo vinculado</h1>
            <div style="font-size:15px;line-height:1.7;color:#33434c;">
<p style="margin:0 0 12px;">Está vinculando <strong>{{var.email}}</strong> a una sesión de atención al cliente.</p>
<p style="margin:0 0 12px;">Verifique la dirección para que podamos ayudarle de forma segura.</p>
<p style="margin:16px 0 0;font-size:12px;color:#5c6b74;word-break:break-all;">Enlace alternativo: {{var.verification_url}}</p>
            </div>


              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:28px 0 8px;">
                <tr>
                  <td style="border-radius:999px;background:#e8a14a;">
                    <a href="{{var.verification_url}}" style="display:inline-block;padding:14px 28px;color:#16333f;text-decoration:none;font-weight:700;font-size:15px;letter-spacing:0.02em;">Verificar correo</a>
                  </td>
                </tr>
              </table>
