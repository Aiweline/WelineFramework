<!-- mail:preheader: Your newsletter welcome coupon is ready -->
<h1 style="margin:0 0 14px;font-size:22px;line-height:1.35;font-weight:700;color:#16333f;">Subscribe welcome gift</h1>
<p style="margin:0 0 12px;font-size:15px;line-height:1.7;color:#33434c;">Thanks for subscribing, <strong style="color:#16333f;">{{var.email}}</strong>!</p>
<p style="margin:0 0 12px;font-size:15px;line-height:1.7;color:#33434c;">Your coupon code: <strong>{{var.coupon_code}}</strong> ({{var.discount_label}}), valid until {{var.valid_until}}.</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:22px 0 10px;">
  <tr>
    <td align="center" bgcolor="#e8a14a" style="background:#e8a14a;border:1px solid #d48f3a;">
      <a href="{{var.shop_url}}" target="_blank" style="display:inline-block;padding:14px 26px;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;color:#16333f;text-decoration:none;border:0;">Shop now</a>
    </td>
  </tr>
</table>
