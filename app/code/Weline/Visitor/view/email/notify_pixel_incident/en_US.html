<!-- mail:preheader: Site incident alert -->
<h1 style="margin:0 0 16px;font-family:Georgia,'Iowan Old Style',Palatino,'Palatino Linotype',serif;font-size:26px;line-height:1.25;font-weight:600;color:#16333f;">Site incident alert</h1>
            <div style="font-size:15px;line-height:1.7;color:#33434c;">
<p style="margin:0 0 12px;"><span style="display:inline-block;padding:4px 10px;border-radius:999px;background:#eef5f7;color:#16333f;font-size:12px;font-weight:700;">{{var.type_label}}</span></p>
<p style="margin:0 0 12px;"><strong>{{var.title}}</strong></p>
<div style="margin:0;padding:16px 18px;background:#f6fafb;border-radius:12px;border:1px solid #e0e9ed;">{{var.content|raw}}</div>
            </div>
