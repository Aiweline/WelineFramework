<!-- mail:preheader: {{var.title}} -->
<h1 style="margin:0 0 16px;font-family:Georgia,'Iowan Old Style',Palatino,'Palatino Linotype',serif;font-size:26px;line-height:1.25;font-weight:600;color:#16333f;">{{var.title}}</h1>
            <div style="font-size:15px;line-height:1.7;color:#33434c;">
<p style="margin:0 0 14px;"><span style="display:inline-block;padding:4px 10px;border-radius:999px;background:#eef5f7;color:#16333f;font-size:12px;font-weight:700;">{{var.type_label}}</span></p>
<div style="margin:0;padding:16px 18px;background:#f6fafb;border-radius:12px;border:1px solid #e0e9ed;line-height:1.7;">{{var.content|raw}}</div>
            </div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:20px 0 8px;border-collapse:collapse;"><tr><td style="padding:10px 16px 10px 0;border-bottom:1px solid #e6eef1;color:#5c6b74;font-size:13px;white-space:nowrap;width:1%;min-width:4.5em;vertical-align:top;">Topik</td><td style="padding:10px 0;border-bottom:1px solid #e6eef1;color:#1c2a32;font-size:13px;font-weight:600;vertical-align:top;word-break:break-word;">{{var.topic_code}}</td></tr></table>
